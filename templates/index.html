<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Витя</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body data-school="{{ school_key }}" data-mode="{{ mode }}">
    <div id="digit_school_logo">
        <img src="{{ url_for('static', filename=school.logo) }}" alt="{{ school.name }}" class="image-size school-logo">
    </div>
    <div class="container">
        <!-- Контейнер для изображения -->
        <div id="image-container">
            <img src="/static/images/vitya.png" alt="Витя" class="image-size" id="default-image">
        </div>

        <!-- Меню для ввода кода -->
        <div class="menu">
            <div class="mode-switch" role="group" aria-label="Режим платформы">
                <button type="button" class="mode-button" data-mode="full">Сезон + занятие</button>
                <button type="button" class="mode-button" data-mode="seasons">Только сезоны</button>
            </div>
            <div class="select-container">
                <div>
                <label for="season-select">Выберите время года:</label>
                <select id="season-select">
                    <option value="nothing"></option>
                    <option value="winter">Зима</option>
                    <option value="spring">Весна</option>
                    <option value="summer">Лето</option>
                    <option value="autumn">Осень</option>
                </select>
                </div>
                <div id="activity-field">
                <label for="activity-select">Выберите занятие:</label>
                <select id="activity-select">
                    <!-- Занятия будут добавляться динамически -->
                </select>
                </div>
            </div>

            <div id="code-input-container"></div>
            <div class="button-row">
                <button id="run-code-button">Запустить код</button>
                <button id="test-code-button">Проверить всё</button>
            </div>
            <div id="test-status"></div>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <div id="success-overlay">
        <div id="success-message">🎉 Вы большие молодцы! 🎉</div>
    </div>

    <!-- Подключение редактора кода Monaco (тот же движок, что в VS Code) -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <!-- Подключение JavaScript-файла -->
    <script src="/static/js/scripts.js"></script>
</body>

</html>
